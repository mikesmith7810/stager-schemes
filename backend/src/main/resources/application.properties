spring.application.name=stager-schemes

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stager_schemes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:stager}
spring.datasource.password=${DB_PASSWORD:stager}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Single-user security — override APP_PASSWORD with a bcrypt hash in production
# Default password is: changeme
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:$2a$10$cSY7mg6Mc67Evx4iQE8h6OiGGiP9yqJdWI3OvZtsiStMMTKsJVfey}
